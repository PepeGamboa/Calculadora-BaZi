<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora BaZi 八字</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Calculadora BaZi 八字</h1>
      <p class="subtitle">Cuatro Pilares del Destino</p>
    </div>

    <div class="card">
      <div class="controls">
        <div class="input-group">
          <label>Fecha de Nacimiento</label>
          <input id="birth-date" type="date" class="input-field" value="1998-06-30">
        </div>
        <div class="input-group">
          <label>Hora de Nacimiento</label>
          <input id="birth-time" type="time" class="input-field" value="08:01">
        </div>
        <button id="calc-btn" class="btn-calc">Calcular</button>
      </div>

      <div id="results" class="hidden">
        <div id="date-display" class="date-display"></div>
        
        <div class="comparison">
          <div class="pillar-column">
            <div class="column-header birth-header">Tu Carta BaZi</div>
            <div id="user-pillars"></div>
          </div>

          <div class="hearts-column" id="hearts"></div>

          <div class="pillar-column">
            <div class="column-header today-header">Hoy</div>
            <div id="today-pillars"></div>
          </div>
        </div>

        <div class="analysis">
          <div class="analysis-title">Análisis de Compatibilidad</div>
          <div id="analysis-result"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="bazi.js"></script>
</body>
</html>
