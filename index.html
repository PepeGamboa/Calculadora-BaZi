Aujourd'hui",analysis:'Analyse de Compatibilité',year:'Année',month:'Mois',day:'Jour',hour:'Heure',excellent:'Excellent',favorable:'Favorable',neutral:'Neutre',unfavorable:'Peu favorable',challenging:'Difficile',todayLabel:"Aujourd'hui",themeLight:'☀️ Mode Clair',themeDark:'🌙 Mode Sombre'}};let currentLang='es',isDark=false;const TRONCOS=[{es:"Yang Madera",cn:"甲 Jia",elem:"Madera",desc:"Firme como un árbol."},{es:"Yin Madera",cn:"乙 Yi",elem:"Madera",desc:"Flexible como enredadera."},{es:"Yang Fuego",cn:"丙 Bing",elem:"Fuego",desc:"Luminoso como el sol."},{es:"Yin Fuego",cn:"丁 Ding",elem:"Fuego",desc:"Cálido como vela."},{es:"Yang Tierra",cn:"戊 Wu",elem:"Tierra",desc:"Estable como montaña."},{es:"Yin Tierra",cn:"己 Ji",elem:"Tierra",desc:"Fértil como tierra."},{es:"Yang Metal",cn:"庚 Geng",elem:"Metal",desc:"Fuerte como espada."},{es:"Yin Metal",cn:"辛 Xin",elem:"Metal",desc:"Refinado como joya."},{es:"Yang Agua",cn:"壬 Ren",elem:"Agua",desc:"Profundo como océano."},{es:"Yin Agua",cn:"癸 Gui",elem:"Agua",desc:"Sutil como lluvia."}];const RAMAS=[{es:"Rata",cn:"子 Zi",animal:"Rata",emoji:"🐀",elem:"Agua",desc:"Astuta."},{es:"Buey",cn:"丑 Chou",animal:"Buey",emoji:"🐂",elem:"Tierra",desc:"Trabajador."},{es:"Tigre",cn:"寅 Yin",animal:"Tigre",emoji:"🐅",elem:"Madera",desc:"Valiente."},{es:"Conejo",cn:"卯 Mao",animal:"Conejo",emoji:"🐇",elem:"Madera",desc:"Sensible."},{es:"Dragón",cn:"辰 Chen",animal:"Dragón",emoji:"🐉",elem:"Tierra",desc:"Magnético."},{es:"Serpiente",cn:"巳 Si",animal:"Serpiente",emoji:"🐍",elem:"Fuego",desc:"Sabia."},{es:"Caballo",cn:"午 Wu",animal:"Caballo",emoji:"🐴",elem:"Fuego",desc:"Libre."},{es:"Cabra",cn:"未 Wei",animal:"Cabra",emoji:"🐐",elem:"Tierra",desc:"Compasiva."},{es:"Mono",cn:"申 Shen",animal:"Mono",emoji:"🐵",elem:"Metal",desc:"Ingenioso."},{es:"Gallo",cn:"酉 You",animal:"Gallo",emoji:"🐔",elem:"Metal",desc:"Observador."},{es:"Perro",cn:"戌 Xu",animal:"Perro",emoji:"🐕",elem:"Tierra",desc:"Leal."},{es:"Cerdo",cn:"亥 Hai",animal:"Cerdo",emoji:"🐖",elem:"Agua",desc:"Generoso."}];const GANZHI=[];for(let i=0;i<60;i++)GANZHI.push({t:TRONCOS[i%10],r:RAMAS[i%12]});const JIEQI=[null,[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7],[1,6]];function getYearPillar(d){let y=d.getFullYear();const[m,day]=JIEQI[1];if(d<new Date(y,m-1,day))y--;let idx=(y-4)%60;if(idx<0)idx+=60;return GANZHI[idx]}function getMonthPillar(d){const y=d.getFullYear();let solarMonth=1;for(let i=1;i<=12;i++){const[m1,d1]=JIEQI[i];const startDate=new Date(y,m1-1,d1);const nextI=(i%12)+1;const[m2,d2]=JIEQI[nextI];const endYear=(i===12)?y+1:y;const endDate=new Date(endYear,m2-1,d2);if(d>=startDate&&d<endDate){solarMonth=i;break}}const branchIdx=(solarMonth+1)%12;const yearTronco=TRONCOS.indexOf(getYearPillar(d).t);const stemBase=[2,4,6,8,0][yearTronco%5];const offset=branchIdx>=2?branchIdx-2:branchIdx+10;const stemIdx=(stemBase+offset)%10;return{t:TRONCOS[stemIdx],r:RAMAS[branchIdx]}}function getDayPillar(d){const ref=new Date(1998,5,30);const target=new Date(d.getFullYear(),d.getMonth(),d.getDate());const days=Math.floor((target-ref)/86400000);let idx=(44+days)%60;if(idx<0)idx+=60;return GANZHI[idx]}function getHourPillar(d){const h=d.getHours();let bi;if(h>=23||h<1)bi=0;else if(h<3)bi=1;else if(h<5)bi=2;else if(h<7)bi=3;else if(h<9)bi=4;else if(h<11)bi=5;else if(h<13)bi=6;else if(h<15)bi=7;else if(h<17)bi=8;else if(h<19)bi=9;else if(h<21)bi=10;else bi=11;const dayTronco=TRONCOS.indexOf(getDayPillar(d).t);const stemBase=[0,2,4,6,8][dayTronco%5];const stemIdx=(stemBase+bi)%10;return{t:TRONCOS[stemIdx],r:RAMAS[bi]}}function color(e){return{Madera:'#10b981',Fuego:'#ef4444',Tierra:'#f59e0b',Metal:'#9ca3af',Agua:'#3b82f6'}[e]||'#6b7280'}function renderPillar(p,lbl){const tc=color(p.t.elem);const rc=color(p.r.elem);return`<div class="pillar-row"><div class="pillar-label">${lbl}</div><div class="pillar-info" style="border-color:${tc}"><div class="pillar-cn" style="color:${tc}">${p.t.cn}</div><div class="pillar-es">${p.t.es}</div><div class="pillar-summary">${p.t.desc}</div></div><div class="pillar-info" style="border-color:${rc}"><div class="animal-emoji">${p.r.emoji}</div><div class="pillar-cn" style="color:${rc}">${p.r.cn}</div><div class="pillar-es">${p.r.animal}</div><div class="pillar-summary">${p.r.desc}</div></div></div>`}function calcCompat(u,tod){const rel={Madera:{gen:'Fuego',ctrl:'Tierra'},Fuego:{gen:'Tierra',ctrl:'Metal'},Tierra:{gen:'Metal',ctrl:'Agua'},Metal:{gen:'Agua',ctrl:'Madera'},Agua:{gen:'Madera',ctrl:'Fuego'}};const k=['y','m','d','h'];let tot=0,sc={};k.forEach(x=>{const ue=u[x].r.elem;const te=tod[x].r.elem;let s=0;if(ue===te)s=2;else if(rel[ue]?.gen===te||rel[te]?.gen===ue)s=1;else if(rel[ue]?.ctrl===te||rel[te]?.ctrl===ue)s=-1;sc[x]=s;tot+=s});return{sc,tot}}function icon(s){return s===2?'❤️':s===1?'💛':s===0?'🤍':'💔'}function analysis(t){const tr=translations[currentLang];if(t>=6)return['❤️❤️❤️❤️❤️',tr.excellent];if(t>=3)return['❤️❤️❤️❤️🤍',tr.favorable];if(t>=0)return['❤️❤️❤️🤍🤍',tr.neutral];if(t>=-3)return['❤️❤️🤍🤍🤍',tr.unfavorable];return['❤️🤍🤍🤍🤍',tr.challenging]}function updateUI(){const tr=translations[currentLang];document.getElementById('subtitle').textContent=tr.title;document.getElementById('label-birth-date').textContent=tr.birthDate;document.getElementById('label-birth-time').textContent=tr.birthTime;document.getElementById('calc-btn').textContent=tr.calculate;document.getElementById('header-birth').textContent=tr.yourChart;document.getElementById('header-today').textContent=tr.today;document.getElementById('analysis-title').textContent=tr.analysis;document.getElementById('theme-toggle').textContent=isDark?tr.themeLight:tr.themeDark}function calculate(){const bd=document.getElementById('birth-date').value;const bt=document.getElementById('birth-time').value;if(!bd||!bt){alert('Ingresa fecha y hora');return}const birth=new Date(bd+'T'+bt+':00');const today=new Date();const user={y:getYearPillar(birth),m:getMonthPillar(birth),d:getDayPillar(birth),h:getHourPillar(birth)};const tod={y:getYearPillar(today),m:getMonthPillar(today),d:getDayPillar(today),h:getHourPillar(today)};const tr=translations[currentLang];document.getElementById('user-pillars').innerHTML=renderPillar(user.y,tr.year)+renderPillar(user.m,tr.month)+renderPillar(user.d,tr.day)+renderPillar(user.h,tr.hour);document.getElementById('today-pillars').innerHTML=renderPillar(tod.y,tr.year)+renderPillar(tod.m,tr.month)+renderPillar(tod.d,tr.day)+renderPillar(tod.h,tr.hour);const comp=calcCompat(user,tod);document.getElementById('hearts').innerHTML=`<div class="heart-box">${icon(comp.sc.y)}</div><div class="heart-box">${icon(comp.sc.m)}</div><div class="heart-box">${icon(comp.sc.d)}</div><div class="heart-box">${icon(comp.sc.h)}</div>`;const[hts,msg]=analysis(comp.tot);document.getElementById('analysis-result').innerHTML=`<div class="analysis-hearts">${hts}</div><div class="analysis-text">${msg}</div>`;const locales={es:'es-ES',en:'en-US',de:'de-DE',it:'it-IT',fr:'fr-FR'};document.getElementById('date-display').textContent=tr.todayLabel+': '+today.toLocaleDateString(locales[currentLang],{weekday:'long',year:'numeric',month:'long',day:'numeric'});document.getElementById('results').classList.remove('hidden')}document.addEventListener('DOMContentLoaded',()=>{document.getElementById('calc-btn').addEventListener('click',calculate);document.getElementById('theme-toggle').addEventListener('click',()=>{isDark=!isDark;document.body.classList.toggle('dark-mode');updateUI()});document.getElementById('lang-button').addEventListener('click',()=>{document.getElementById('lang-dropdown').classList.toggle('active')});document.querySelectorAll('.lang-option').forEach(opt=>{opt.addEventListener('click',()=>{currentLang=opt.dataset.lang;const flags={es:'<svg class="lang-flag" viewBox="0 0 900 600"><rect width="900" height="600" fill="#c60b1e"/><rect width="900" height="400" y="100" fill="#ffc400"/><rect width="900" height="200" y="200" fill="#c60b1e"/></svg>',en:'<svg class="lang-flag" viewBox="0 0 60 30"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>',de:'<svg class="lang-flag" viewBox="0 0 900 600"><rect width="900" height="600" fill="#000"/><rect width="900" height="400" y="200" fill="#D00"/><rect width="900" height="200" y="400" fill="#FFCE00"/></svg>',it:'<svg class="lang-flag" viewBox="0 0 900 600"><rect width="300" height="600" fill="#009246"/><rect width="300" height="600" x="300" fill="#fff"/><rect width="300" height="600" x="600" fill="#ce2b37"/></svg>',fr:'<svg class="lang-flag" viewBox="0 0 900 600"><rect width="300" height="600" fill="#002395"/><rect width="300" height="600" x="300" fill="#fff"/><rect width="300" height="600" x="600" fill="#ED2939"/></svg>'};const codes={es:'ESP',en:'ENG',de:'DEU',it:'ITA',fr:'FRA'};document.getElementById('lang-button').innerHTML=flags[currentLang]+`<span id="lang-text">${codes[currentLang]}</span>`;document.getElementById('lang-dropdown').classList.remove('active');updateUI();if(!document.getElementById('results').classList.contains('hidden')){calculate()}})});document.addEventListener('click',(e)=>{if(!e.target.closest('.lang-selector')){document.getElementById('lang-dropdown').classList.remove('active')}});setTimeout(calculate,100)})
</script>
