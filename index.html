
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora BaZi 八字</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-blue-400 to-purple-600 font-sans transition-colors duration-500">

  <!-- Controles superiores -->
  <div class="flex justify-end items-center gap-4 p-4">
    <!-- Botón modo oscuro -->
    <button id="theme-toggle" class="px-3 py-2 rounded-lg bg-white/20 backdrop-blur-md text-white shadow-md">
      🌙
    </button>

    <!-- Selector de idioma -->
    <div class="relative">
      <button id="lang-btn" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-white/20 backdrop-blur-md text-white shadow-md">
        <span id="lang-flag">🇪🇸</span> <span id="lang-code">ESP</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div id="lang-menu" class="hidden absolute right-0 mt-2 w-28 bg-white dark:bg-slate-800 rounded-lg shadow-lg">
        <button data-lang="es" class="lang-option flex items-center gap-2 px-3 py-2 w-full">🇪🇸 ESP</button>
        <button data-lang="en" class="lang-option flex items-center gap-2 px-3 py-2 w-full">🇬🇧 ENG</button>
        <button data-lang="de" class="lang-option flex items-center gap-2 px-3 py-2 w-full">🇩🇪 DEU</button>
        <button data-lang="it" class="lang-option flex items-center gap-2 px-3 py-2 w-full">🇮🇹 ITA</button>
        <button data-lang="fr" class="lang-option flex items-center gap-2 px-3 py-2 w-full">🇫🇷 FRA</button>
      </div>
    </div>
  </div>

  <!-- Contenedor principal -->
  <div class="container mx-auto my-8 p-4 md:p-8">
    <div class="bg-white/30 dark:bg-slate-900/40 shadow-xl rounded-lg backdrop-blur-md">

      <!-- Encabezado -->
      <div class="header-gradient text-white p-6 rounded-t-lg">
        <h1 id="title" class="text-3xl md:text-4xl font-bold text-center">Calculadora BaZi 八字</h1>
        <p id="subtitle" class="text-center text-lg mt-1">Cuatro Pilares del Destino</p>
      </div>

      <!-- Contenido -->
      <div class="p-6 md:p-8">
        <p id="intro" class="text-center text-gray-800 dark:text-gray-200 mb-6 text-lg">
          Ingresa tu fecha y hora de nacimiento para generar tu carta BaZi.
        </p>

        <!-- Formulario -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 items-end">
          <div>
            <label id="label-date" for="birth-date" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Fecha de Nacimiento:</label>
            <input type="date" id="birth-date"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm p-3"
              value="1998-06-30">
          </div>
          <div>
            <label id="label-time" for="birth-time" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Hora de Nacimiento:</label>
            <input type="time" id="birth-time"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm p-3"
              value="08:00">
          </div>
          <div>
            <button id="calculate-btn" class="btn-main w-full">
              Calcular Pilares
            </button>
          </div>
        </div>

        <!-- Resultados -->
        <div id="results-container" class="hidden">
          <div class="mb-10">
            <h2 id="user-chart-title" class="text-2xl font-semibold text-gray-800 dark:text-gray-200 mb-4 border-b-2 border-primary pb-2">Tu Carta BaZi</h2>
            <div id="user-bazi-chart" class="bazi-chart-grid"></div>
          </div>
          <div>
            <h2 id="today-chart-title" class="text-2xl font-semibold text-gray-800 dark:text-gray-200 mb-4 border-b-2 border-secondary pb-2">
              Carta BaZi del Día de Hoy (<span id="today-date-display"></span>)
            </h2>
            <div id="today-bazi-chart" class="bazi-chart-grid"></div>
          </div>
        </div>

        <!-- Error -->
        <div id="error-message" class="hidden mt-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-md">
          ⚠️ Ingresa una fecha y hora válidas.
        </div>
      </div>
    </div>
  </div>

  <script src="bazi.js"></script>
  <script src="lang.js"></script>
</body>
</html>
