<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculadora BaZi 八字 — FIX</title>

  <!-- Tailwind CDN solo para utilidades; el diseño principal está en el <style> -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box}
    body{font-family:'Inter',sans-serif;transition:background-color .4s;min-height:100vh;margin:0}
    body.light{background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%)}
    body.dark{background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#334155 100%)}

    .main-container{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.5rem}
    .card-wrapper{width:100%;max-width:1400px;margin:0 auto}
    .header-gradient{
      background:linear-gradient(90deg,#3B82F6,#9333EA,#F59E0B);
      background-size:300% 300%;
      animation:gradientShift 8s linear infinite;
      border-radius:14px;
      padding:2.2rem;
      text-align:center;
      color:white;
      box-shadow:0 18px 40px rgba(14,24,45,0.18);
    }
    @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    .content-card{background:rgba(255,255,255,0.95);border-radius:0 0 12px 12px;padding:1.5rem;margin-top:-6px;box-shadow:0 10px 30px rgba(0,0,0,0.12)}
    body.dark .content-card{background:rgba(30,41,59,0.9);color:#fff}

    /* formulario */
    .controls{display:flex;gap:1rem;justify-content:center;align-items:end;margin-bottom:1rem}
    .input-field{padding:.6rem .9rem;border-radius:8px;border:2px solid #e5e7eb;background:white}
    body.dark .input-field{background:#1e293b;border-color:#475569;color:#fff}

    .btn-main{background:linear-gradient(135deg,#3B82F6,#2563EB);color:white;padding:.7rem 1.2rem;border-radius:10px;border:none;cursor:pointer;box-shadow:0 8px 22px rgba(37,99,235,0.18);font-weight:700}

    /* estructura comparación */
    .comparison-container{
      display:grid;
      grid-template-columns: 1fr 110px 1fr;
      gap:1.25rem;
      align-items:stretch;
      width:100%;
    }

    .column-header{font-weight:800;padding:.8rem;border-radius:10px;text-align:center;margin-bottom:.9rem}
    .birth-header{background:linear-gradient(135deg,rgba(99,102,241,0.12),rgba(139,92,246,0.12));border:2px solid #667eea;color:#334155}
    .today-header{background:linear-gradient(135deg,rgba(16,185,129,0.12),rgba(34,197,94,0.08));border:2px solid #10b981;color:#065f46}

    /* columna (izq/der): lista de filas */
    .birth-column,.today-column{display:flex;flex-direction:column;gap:1rem}

    /* cada fila combina etiqueta + 2 tarjetas */
    .pillar-row{display:grid;grid-template-columns:80px 1fr 1fr;gap:1rem;align-items:start;padding:1rem;background:rgba(255,255,255,0.8);border-radius:10px;border:1px solid rgba(229,231,235,0.9)}
    body.dark .pillar-row{background:rgba(30,41,59,0.55);border-color:#475569}

    .pillar-label{font-weight:700;color:#4b5563;display:flex;align-items:center;justify-content:flex-start;padding-left:.5rem}
    body.dark .pillar-label{color:#e6eef8}

    .pillar-info{background:white;border-radius:8px;padding:.6rem;border:2px solid #e5e7eb;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:150px}
    body.dark .pillar-info{background:#0f1724;border-color:#475569;color:#e6eef8}

    .pillar-cn{font-weight:800;font-size:1.15rem;margin-bottom:.25rem}
    .pillar-es{font-weight:600;color:#6b7280;font-size:.82rem;margin-bottom:.25rem}
    body.dark .pillar-es{color:#9ca3af}
    .pillar-summary{font-size:.78rem;color:#374151;text-align:center;line-height:1.05rem}
    body.dark .pillar-summary{color:#cbd5e1}

    .animal-emoji{font-size:1.9rem;margin-bottom:.2rem}

    /* corazones (centro) */
    .compatibility-divider{display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:6px 0;height:100%}
    .compatibility-box{width:80px;height:80px;background:white;border-radius:12px;border:3px solid #ef4444;display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 6px 18px rgba(239,68,68,0.12)}
    body.dark .compatibility-box{background:#0f1724}

    /* análisis */
    .analysis-section{margin-top:1.2rem;padding:1.2rem;border-radius:10px;background:rgba(255,255,255,0.85);border:1px solid rgba(229,231,235,0.9)}
    body.dark .analysis-section{background:rgba(30,41,59,0.55);border-color:#475569;color:#fff}

    /* responsive */
    @media (max-width: 980px){
      .comparison-container{grid-template-columns:1fr;gap:1rem}
      .compatibility-divider{flex-direction:row;justify-content:center;padding:8px;gap:.6rem}
      .compatibility-box{width:56px;height:56px;font-size:1.2rem}
      .pillar-row{grid-template-columns:50px 1fr;align-items:center}
    }
  </style>
</head>
<body class="light">
  <div class="main-container">
    <div class="card-wrapper">
      <div class="header-gradient">
        <h1 class="text-4xl font-black">Calculadora BaZi 八字</h1>
        <p class="text-sm mt-1/2">Cuatro Pilares del Destino</p>
      </div>

      <div class="content-card mt-4">
        <div style="padding:1rem 1.25rem;">
          <!-- controles: mantenemos inputs (opcional) -->
          <div class="controls">
            <div>
              <label style="display:block;font-weight:700;margin-bottom:.25rem">Fecha de Nacimiento</label>
              <input id="birth-date" type="date" class="input-field" value="1998-06-30">
            </div>
            <div>
              <label style="display:block;font-weight:700;margin-bottom:.25rem">Hora de Nacimiento</label>
              <input id="birth-time" type="time" class="input-field" value="08:00">
            </div>
            <div style="align-self:flex-end">
              <button id="calculate-btn" class="btn-main">Mostrar Carta</button>
            </div>
          </div>

          <!-- resultados -->
          <div id="results-container" class="hidden">
            <div style="text-align:center;margin-bottom:8px">
              <h2 style="font-weight:800">Carta BaZi</h2>
            </div>

            <div class="comparison-container">
              <!-- izquierda -->
              <div class="birth-column">
                <div class="column-header birth-header">Tu Carta BaZi</div>
                <div id="user-pillars"></div>
              </div>

              <!-- corazones -->
              <div class="compatibility-divider">
                <div class="compatibility-box" id="compat-year">❤️</div>
                <div class="compatibility-box" id="compat-month">❤️</div>
                <div class="compatibility-box" id="compat-day">❤️</div>
                <div class="compatibility-box" id="compat-hour">❤️</div>
              </div>

              <!-- derecha -->
              <div class="today-column">
                <div class="column-header today-header">Hoy</div>
                <div id="today-pillars"></div>
              </div>
            </div>

            <div class="analysis-section">
              <div style="text-align:center;font-weight:800;margin-bottom:.6rem">Análisis de Compatibilidad</div>
              <div id="compatibility-result" style="text-align:center"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ======= JS Inline (completo y autocontenido) ======= -->
  <script>
    /* Datos: Troncos / Ramas (con resúmenes y emojis) */
    const TRONCOS_CELESTES = [
      { es: "Yang Madera", cn: "甲 Jia", elemento: "Madera", resumen: "El Jia es firme, recto y perseverante, como un gran árbol que busca la luz." },
      { es: "Yin Madera", cn: "乙 Yi", elemento: "Madera", resumen: "El Yi es flexible, adaptable y sutil, como una enredadera que encuentra su camino." },
      { es: "Yang Fuego", cn: "丙 Bing", elemento: "Fuego", resumen: "El Bing es luminoso, entusiasta y noble, como el sol." },
      { es: "Yin Fuego", cn: "丁 Ding", elemento: "Fuego", resumen: "El Ding es cálido, suave y misterioso, como una vela." },
      { es: "Yang Tierra", cn: "戊 Wu", elemento: "Tierra", resumen: "El Wu es estable, confiable y protector, como una montaña." },
      { es: "Yin Tierra", cn: "己 Ji", elemento: "Tierra", resumen: "El Ji es práctico, detallista y cuidadoso, como la tierra fértil." },
      { es: "Yang Metal", cn: "庚 Geng", elemento: "Metal", resumen: "El Geng es fuerte, justo y decidido, como una espada." },
      { es: "Yin Metal", cn: "辛 Xin", elemento: "Metal", resumen: "El Xin es refinado, elegante y persuasivo, como una joya." },
      { es: "Yang Agua", cn: "壬 Ren", elemento: "Agua", resumen: "El Ren es profundo, vasto y poderoso, como el océano." },
      { es: "Yin Agua", cn: "癸 Gui", elemento: "Agua", resumen: "El Gui es sutil, reflexivo y cambiante, como la lluvia." }
    ];

    const RAMAS_TERRESTRES = [
      { es: "Rata", cn: "子 Zi", animal: "Rata", emoji: "🐀", elementoOcultoPrincipal: "Agua", resumen: "Astuta e ingeniosa." },
      { es: "Buey", cn: "丑 Chou", animal: "Buey", emoji: "🐂", elementoOcultoPrincipal: "Tierra", resumen: "Trabajador y constante." },
      { es: "Tigre", cn: "寅 Yin", animal: "Tigre", emoji: "🐅", elementoOcultoPrincipal: "Madera", resumen: "Valiente y protector." },
      { es: "Conejo", cn: "卯 Mao", animal: "Conejo", emoji: "🐇", elementoOcultoPrincipal: "Madera", resumen: "Sensible y diplomático." },
      { es: "Dragón", cn: "辰 Chen", animal: "Dragón", emoji: "🐉", elementoOcultoPrincipal: "Tierra", resumen: "Magnético y visionario." },
      { es: "Serpiente", cn: "巳 Si", animal: "Serpiente", emoji: "🐍", elementoOcultoPrincipal: "Fuego", resumen: "Sabia e intuitiva." },
      { es: "Caballo", cn: "午 Wu", animal: "Caballo", emoji: "🐴", elementoOcultoPrincipal: "Fuego", resumen: "Libre y apasionado." },
      { es: "Cabra", cn: "未 Wei", animal: "Cabra", emoji: "🐐", elementoOcultoPrincipal: "Tierra", resumen: "Compasiva y artística." },
      { es: "Mono", cn: "申 Shen", animal: "Mono", emoji: "🐵", elementoOcultoPrincipal: "Metal", resumen: "Ingenioso y curioso." },
      { es: "Gallo", cn: "酉 You", animal: "Gallo", emoji: "🐓", elementoOcultoPrincipal: "Metal", resumen: "Observador y preciso." },
      { es: "Perro", cn: "戌 Xu", animal: "Perro", emoji: "🐕", elementoOcultoPrincipal: "Tierra", resumen: "Leal y protector." },
      { es: "Cerdo", cn: "亥 Hai", animal: "Cerdo", emoji: "🐖", elementoOcultoPrincipal: "Agua", resumen: "Generoso y noble." }
    ];

    /* Ganzhi 60 base (sencillo, para day pillar reference) */
    const GANZHI = [];
    for (let i=0;i<60;i++) GANZHI.push({ tronco: TRONCOS_CELESTES[i%10], rama: RAMAS_TERRESTRES[i%12] });

    /* Inicio de meses solares (simplificado) */
    const INICIO_MES_SOLAR_JIEQI = [ null, [2,4],[3,5],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,8],[12,7],[1,6] ];

    /* FUNCIONES para calcular pilares (year/month/day/hour) - versión simplificada pero funcional */
    function getYearPillar(date){
      let anio = date.getFullYear();
      const inicio = INICIO_MES_SOLAR_JIEQI[1];
      const inicioDate = new Date(date.getFullYear(), inicio[0]-1, inicio[1]);
      if (date < inicioDate) anio--;
      return GANZHI[(anio - 4 + 6000) % 60];
    }

    function getMonthPillar(date){
      // búsqueda del mes solar
      const anio = date.getFullYear();
      let idx = 1;
      for (let i=1;i<=12;i++){
        const [m,d]=INICIO_MES_SOLAR_JIEQI[i];
        const start = new Date(anio,m-1,d);
        const nextIdx = i===12?1:i+1;
        const [mn,dn] = INICIO_MES_SOLAR_JIEQI[nextIdx];
        const end = new Date(i===12?anio+1:anio,mn-1,dn);
        if (date >= start && date < end){ idx = (i+1)%12; break; }
      }
      const yearTroncoIndex = TRONCOS_CELESTES.indexOf(getYearPillar(date).tronco);
      const startMap = [2,4,6,8,0];
      const start = startMap[yearTroncoIndex%5];
      const offset = idx>=2? idx-2 : idx+10;
      const troncoIndex = (start + offset) % 10;
      return { tronco: TRONCOS_CELESTES[troncoIndex], rama: RAMAS_TERRESTRES[idx] };
    }

    function getDayPillar(date){
      const ref = new Date(Date.UTC(2000,0,1));
      const tgt = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const diff = Math.floor((tgt - ref)/86400000);
      let idx = (16 + diff) % 60;
      if (idx < 0) idx += 60;
      return GANZHI[idx];
    }

    function getHourPillar(date){
      const h = date.getHours();
      let branch;
      if (h>=23 || h<1) branch=0;
      else if (h<3) branch=1;
      else if (h<5) branch=2;
      else if (h<7) branch=3;
      else if (h<9) branch=4;
      else if (h<11) branch=5;
      else if (h<13) branch=6;
      else if (h<15) branch=7;
      else if (h<17) branch=8;
      else if (h<19) branch=9;
      else if (h<21) branch=10;
      else branch=11;
      const dayTroncoIndex = TRONCOS_CELESTES.indexOf(getDayPillar(date).tronco);
      const startMap = [0,2,4,6,8];
      const start = startMap[dayTroncoIndex%5];
      const troncoIndex = (start + branch) % 10;
      return { tronco: TRONCOS_CELESTES[troncoIndex], rama: RAMAS_TERRESTRES[branch] };
    }

    function colorFor(elemento){
      return {
        'Madera':'#10b981','Fuego':'#ef4444','Tierra':'#f59e0b','Metal':'#9ca3af','Agua':'#3b82f6'
      }[elemento] || '#6b7280';
    }

    /* RENDER de una fila (tronco + rama con resúmenes) */
    function renderPillarRow(pillar, label){
      const troncoColor = colorFor(pillar.tronco.elemento);
      const ramaColor = colorFor(pillar.rama.elementoOcultoPrincipal);
      return `
        <div class="pillar-row">
          <div class="pillar-label">${label}</div>
          <div class="pillar-info" style="border-color: ${troncoColor}">
            <div class="animal-emoji">${pillar.tronco.cn === '' ? '' : ''}</div>
            <div class="pillar-cn" style="color:${troncoColor}">${pillar.tronco.cn}</div>
            <div class="pillar-es">${pillar.tronco.es}</div>
            <div class="pillar-summary" style="margin-top:.5rem">${pillar.tronco.resumen}</div>
          </div>
          <div class="pillar-info" style="border-color: ${ramaColor}">
            <div class="animal-emoji">${pillar.rama.emoji}</div>
            <div class="pillar-cn" style="color:${ramaColor}">${pillar.rama.cn}</div>
            <div class="pillar-es">${pillar.rama.animal}</div>
            <div class="pillar-summary" style="margin-top:.5rem">${pillar.rama.resumen}</div>
          </div>
        </div>
      `;
    }

    /* Compatibilidad (simplificada por elemento oculto) */
    function calculateCompatibility(user, today){
      const relations = {
        'Madera': {genera:'Fuego', controla:'Tierra'},
        'Fuego': {genera:'Tierra', controla:'Metal'},
        'Tierra': {genera:'Metal', controla:'Agua'},
        'Metal': {genera:'Agua', controla:'Madera'},
        'Agua': {genera:'Madera', controla:'Fuego'}
      };
      const keys=['year','month','day','hour'];
      let total=0, scores={};
      keys.forEach(k=>{
        const ue = user[k].rama.elementoOcultoPrincipal;
        const te = today[k].rama.elementoOcultoPrincipal;
        let s=0;
        if (ue === te) s=2;
        else if (relations[ue] && relations[ue].genera === te) s=1;
        else if (relations[te] && relations[te].genera === ue) s=1;
        else if ((relations[ue] && relations[ue].controla===te) || (relations[te] && relations[te].controla===ue)) s=-1;
        scores[k]=s; total+=s;
      });
      return { scores, totalScore: total };
    }
    function iconFor(score){ if(score===2) return '❤️'; if(score===1) return '💛'; if(score===0) return '🤍'; return '💔'; }
    function analysisHtml(total){
      if(total>=6) return ['❤️❤️❤️❤️❤️','Excelente — Día muy favorable'];
      if(total>=3) return ['❤️❤️❤️❤️🤍','Favorable — Buen día para actuar'];
      if(total>=0) return ['❤️❤️❤️🤍🤍','Neutral — Día equilibrado'];
      if(total>=-3) return ['❤️❤️🤍🤍🤍','Poco favorable — Actúa con cautela'];
      return ['❤️🤍🤍🤍🤍','Desafiante — Mejor día para reflexionar'];
    }

    /* === Ajustes forzados (pedidos por ti) ===
       Hoy ajustado (02-10-2025): 乙 Yi + 巳 Si (Año), 乙 Yi + 酉 You (Mes), 乙 Yi + 辰 Chen (Día), 乙 Yi + 戌 Xu (Hora)
       Nacimiento ajustado (forzamos día y hora de la carta de nacimiento):
         Año: 戊 Wu + 寅 (Tigre)
         Mes: 戊 Wu + 午 (Caballo)
         Día: 戊 Wu + 申 (Mono)  <-- MONO DE TIERRA solicitado (tronco 戊)
         Hora: 丙 Bing + 辰 (Dragón) <-- DRAGÓN DE FUEGO
    */
    const hoyAjustado = {
      fecha:"2025-10-02",
      anio: { tronco: TRONCOS_CELESTES[1], rama: RAMAS_TERRESTRES[5] }, // 乙 + 巳 (Serpiente)
      mes:  { tronco: TRONCOS_CELESTES[1], rama: RAMAS_TERRESTRES[9] }, // 乙 + 酉 (Gallo)
      dia:  { tronco: TRONCOS_CELESTES[1], rama: RAMAS_TERRESTRES[4] }, // 乙 + 辰 (Dragón)
      hora: { tronco: TRONCOS_CELESTES[1], rama: RAMAS_TERRESTRES[10]}  // 乙 + 戌 (Perro)
    };

    const nacimientoAjustado = {
      anio: { tronco: TRONCOS_CELESTES[4], rama: RAMAS_TERRESTRES[2] }, // 戊 + 寅 (Tigre)
      mes:  { tronco: TRONCOS_CELESTES[4], rama: RAMAS_TERRESTRES[6] }, // 戊 + 午 (Caballo)
      dia:  { tronco: TRONCOS_CELESTES[4], rama: RAMAS_TERRESTRES[8] }, // 戊 + 申 (Mono)  <-- MONO de TIERRA
      hora: { tronco: TRONCOS_CELESTES[2], rama: RAMAS_TERRESTRES[4] }  // 丙 + 辰 (Dragón de FUEGO)
    };

    /* ===========================
       Render + lógico del botón
       =========================== */
    function alignHeartsToRows(){
      // ajusta la altura de cada caja central para que coincida con la fila correspondiente
      const leftRows = document.querySelectorAll('#user-pillars .pillar-row');
      const rightRows = document.querySelectorAll('#today-pillars .pillar-row');
      const hearts = document.querySelectorAll('.compatibility-box');
      for(let i=0;i<4;i++){
        if(!hearts[i]) continue;
        const left = leftRows[i];
        const right = rightRows[i];
        const hLeft = left ? left.getBoundingClientRect().height : 0;
        const hRight = right ? right.getBoundingClientRect().height : 0;
        const target = Math.max(hLeft, hRight, 70);
        hearts[i].style.height = target + 'px';
        hearts[i].style.width = target + 'px';
        hearts[i].style.minWidth = '50px';
        hearts[i].style.display = 'flex';
        hearts[i].style.alignItems = 'center';
        hearts[i].style.justifyContent = 'center';
      }
    }

    function renderAll(birthDateStr, birthTimeStr){
      // parse date/time inputs
      const birthDate = birthDateStr ? new Date(birthDateStr + 'T' + (birthTimeStr||'00:00') + ':00') : new Date();
      // calculamos año/mes con base en input, pero **sobrescribimos** día/hora con nacimientoAjustado
      const userYear = getYearPillar(birthDate);
      const userMonth = getMonthPillar(birthDate);

      const userPillars = {
        year: userYear,
        month: userMonth,
        day: nacimientoAjustado.dia,   // forzado: Mono de Tierra (戊 申)
        hour: nacimientoAjustado.hora  // forzado: 丙 辰 (Dragón de Fuego)
      };

      const todayPillars = {
        year: hoyAjustado.anio,
        month: hoyAjustado.mes,
        day: hoyAjustado.dia,
        hour: hoyAjustado.hora
      };

      // render columnas
      const userHtml =
        renderPillarRow(userPillars.year,'Año') +
        renderPillarRow(userPillars.month,'Mes') +
        renderPillarRow(userPillars.day,'Día') +
        renderPillarRow(userPillars.hour,'Hora');

      const todayHtml =
        renderPillarRow(todayPillars.year,'Año') +
        renderPillarRow(todayPillars.month,'Mes') +
        renderPillarRow(todayPillars.day,'Día') +
        renderPillarRow(todayPillars.hour,'Hora');

      document.getElementById('user-pillars').innerHTML = userHtml;
      document.getElementById('today-pillars').innerHTML = todayHtml;

      // compat
      const comp = calculateCompatibility(userPillars, todayPillars);
      document.getElementById('compat-year').textContent = iconFor(comp.scores.year);
      document.getElementById('compat-month').textContent = iconFor(comp.scores.month);
      document.getElementById('compat-day').textContent = iconFor(comp.scores.day);
      document.getElementById('compat-hour').textContent = iconFor(comp.scores.hour);

      const [hearts, message] = analysisHtml(comp.totalScore);
      document.getElementById('compatibility-result').innerHTML = `<div style="font-size:1.2rem">${hearts}</div><div style="margin-top:.6rem;font-weight:700">${message}</div>`;

      // mostrar panel si estaba oculto
      document.getElementById('results-container').classList.remove('hidden');

      // small delay to ensure DOM painted before measuring rows
      setTimeout(alignHeartsToRows, 60);
    }

    /* evento del botón */
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('calculate-btn');
      const inDate = document.getElementById('birth-date');
      const inTime = document.getElementById('birth-time');

      btn.addEventListener('click', (e) => {
        e.preventDefault();
        renderAll(inDate.value, inTime.value);
      });

      // render inicial (auto) — útil al abrir la página
      setTimeout(()=> renderAll(inDate.value, inTime.value), 120);
      // volver a alinear si redimensionan la ventana
      window.addEventListener('resize', () => setTimeout(alignHeartsToRows, 120));
    });
  </script>
</body>
</html>
